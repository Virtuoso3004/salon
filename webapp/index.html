<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Lumière — запись</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f7f1e3;
  --card:rgba(255,253,247,.85);
  --text:#4a3b22;
  --muted:#9a8660;
  --gold:#b68f54;
  --gold-dark:#8a6e47;
  --line:rgba(182,143,84,.38);
  --gold-grad:linear-gradient(135deg,#dcc183 0%,#b68f54 55%,#d9bd7f 100%);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;padding:0 16px 120px;color:var(--text);
  background:radial-gradient(ellipse 120% 60% at 50% 0%,#fffaf0 0%,var(--bg) 62%);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
}
.wrap{max-width:520px;margin:0 auto}

/* логотип */
.hero{position:relative;margin:0 -16px;overflow:hidden;aspect-ratio:10/7.4}
.hero img{
  display:block;width:115%;height:100%;margin-left:-7.5%;object-fit:cover;object-position:center 49%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,#000 95%,transparent 100%);
  -webkit-mask-composite:source-in;
          mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,#000 95%,transparent 100%);
          mask-composite:intersect;
}
.wordmark{display:none;text-align:center;padding:34px 0 8px;font-family:var(--serif);
  font-size:56px;font-weight:600;background:var(--gold-grad);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.hero.noimg .wordmark{display:block}
.hero.noimg{aspect-ratio:auto}
.hero.noimg img{display:none}

.lead{text-align:center;margin:10px 0 6px}
.lead .cap{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500}
.divider{display:flex;align-items:center;gap:12px;margin:16px 24px 4px;color:var(--gold)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.divider::after{transform:scaleX(-1)}
.divider span{font-size:13px}

/* заголовки шагов */
.step{margin-top:26px}
.step h2{
  display:flex;align-items:center;gap:10px;margin:0 0 12px;
  font:600 22px/1.1 var(--serif);color:var(--gold-dark);letter-spacing:.01em
}
.step h2 i{
  font:600 14px/1 var(--serif);font-style:normal;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center
}
.hidden{display:none!important}

/* карточки */
.list{display:flex;flex-direction:column;gap:10px}
.card{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  color:var(--text);font:inherit;transition:box-shadow .2s,border-color .2s,background .2s;
}
.card:active{transform:scale(.99)}
.card .main{flex:1;min-width:0}
.card .name{font:600 19px/1.15 var(--serif);display:block}
.card small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.price{
  font:700 20px/1 var(--serif);white-space:nowrap;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent
}
.card.sel{border-color:var(--gold);background:#fffbf0;box-shadow:0 0 0 3px rgba(182,143,84,.16),0 6px 18px rgba(182,143,84,.14)}
.avatar{
  width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--gold);font:600 22px/1 var(--serif);color:var(--gold);
  background:radial-gradient(circle at 35% 30%,#fffdf6,#f3e8cc)
}

/* дата и время */
.row{display:flex;flex-wrap:wrap;gap:8px}
.dates{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.chip{
  flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);
  padding:9px 0;min-width:54px;text-align:center;cursor:pointer;font:600 19px/1.1 var(--serif)
}
.chip small{display:block;font:500 11px/1.2 -apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-top:3px}
.times .chip{min-width:78px;padding:11px 0;border-radius:999px;font-size:18px}
.chip.sel{background:var(--gold-grad);border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(182,143,84,.32)}
.chip.sel small{color:rgba(255,255,255,.85)}
.note{color:var(--muted);font-size:14px;padding:6px 2px}

/* итог и поля */
.summary{
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;
  background:linear-gradient(180deg,#fffdf7,#fbf4e2)
}
.summary .t{font:600 19px/1.2 var(--serif);color:var(--gold-dark)}
.summary .s{color:var(--muted);font-size:14px;margin-top:3px}
.summary .p{margin-top:8px;display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px dashed var(--line);padding-top:8px;font-size:14px;color:var(--muted)}
input{
  width:100%;padding:14px 16px;margin-bottom:10px;border-radius:14px;border:1px solid var(--line);
  background:#fffdf8;color:var(--text);font:inherit;outline:none;transition:box-shadow .2s,border-color .2s
}
input::placeholder{color:#b8a888}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(182,143,84,.16)}
.foot{text-align:center;margin-top:34px;color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.foot b{display:block;font:600 22px var(--serif);letter-spacing:.04em;text-transform:none;color:var(--gold);margin-bottom:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero" id="hero">
    <img src="/static/1794478708598.jpg" alt="Lumière" onerror="document.getElementById('hero').classList.add('noimg')">
    <div class="wordmark">lumière</div>
  </div>

  <div class="lead">
    <div class="cap">Онлайн-запись</div>
    <div class="divider"><span>✦</span></div>
  </div>

  <div class="step"><h2><i>1</i>Выберите услугу</h2>
    <div id="services" class="list"><div class="note">Загрузка…</div></div>
  </div>

  <div class="step hidden" id="s2"><h2><i>2</i>Выберите мастера</h2>
    <div id="masters" class="list"></div>
  </div>

  <div class="step hidden" id="s3"><h2><i>3</i>Дата и время</h2>
    <div id="dates" class="row dates"></div>
    <div id="times" class="row times" style="margin-top:6px"></div>
  </div>

  <div class="step hidden" id="s4"><h2><i>4</i>Ваши данные</h2>
    <div class="summary" id="summary"></div>
    <input id="name" type="text" placeholder="Ваше имя" maxlength="60" autocomplete="name">
    <input id="phone" type="tel" placeholder="Телефон: +7 900 000-00-00" maxlength="25" autocomplete="tel">
  </div>

  <div class="foot"><b>lumière</b>салон красоты</div>
</div>

<script>
const tg = Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor("#f7f1e3"); tg.setBackgroundColor("#f7f1e3"); } catch (e) {}
tg.MainButton.setParams({text: "Записаться", color: "#b68f54", text_color: "#ffffff"});

const state = {service: null, master: null, date: null, dateLabel: "", time: null};
let cfg = null;
const $ = id => document.getElementById(id);
const WEEK = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
const money = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
const pad = n => String(n).padStart(2, "0");

function mark(box, node) {
  box.querySelectorAll(".sel").forEach(x => x.classList.remove("sel"));
  node.classList.add("sel");
}
function scrollTo(id) {
  setTimeout(() => $(id).scrollIntoView({behavior: "smooth", block: "start"}), 60);
}

async function init() {
  try {
    cfg = await (await fetch("/api/config")).json();
  } catch (e) {
    $("services").textContent = "Не удалось загрузить данные. Закройте и откройте снова.";
    return;
  }
  renderServices();
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u && u.first_name) $("name").value = u.first_name;
}

function renderServices() {
  const box = $("services");
  box.textContent = "";
  cfg.services.forEach(s => {
    const b = el("button", "card");
    const main = el("div", "main");
    main.append(el("span", "name", s.name), el("small", "", s.minutes + " мин"));
    b.append(main, el("span", "price", money(s.price)));
    b.onclick = () => {
      mark(box, b);
      state.service = s; state.master = null; state.date = null; state.time = null;
      $("s3").classList.add("hidden");
      $("s4").classList.add("hidden");
      renderMasters();
      updateButton();
      scrollTo("s2");
    };
    box.append(b);
  });
}

function renderMasters() {
  const box = $("masters");
  box.textContent = "";
  cfg.masters.filter(m => m.services.includes(state.service.id)).forEach(m => {
    const b = el("button", "card");
    const main = el("div", "main");
    main.append(el("span", "name", m.name), el("small", "", m.role));
    b.append(el("div", "avatar", m.name.charAt(0)), main);
    b.onclick = () => {
      mark(box, b);
      state.master = m; state.date = null; state.time = null;
      $("times").textContent = "";
      renderDates();
      $("s3").classList.remove("hidden");
      $("s4").classList.add("hidden");
      updateButton();
      scrollTo("s3");
    };
    box.append(b);
  });
  $("s2").classList.remove("hidden");
}

function renderDates() {
  const box = $("dates");
  box.textContent = "";
  const base = new Date(cfg.today + "T12:00:00");
  for (let i = 0; i <= cfg.days; i++) {
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    const iso = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    const b = el("button", "chip", String(d.getDate()));
    b.append(el("small", "", WEEK[d.getDay()]));
    b.onclick = () => {
      mark(box, b);
      state.date = iso;
      state.dateLabel = d.getDate() + " " + MONTHS[d.getMonth()];
      state.time = null;
      loadSlots();
      updateButton();
    };
    box.append(b);
  }
}

async function loadSlots() {
  const box = $("times");
  box.textContent = "";
  box.append(el("div", "note", "Ищу свободное время…"));
  try {
    const url = "/api/slots?master=" + state.master.id + "&service=" + state.service.id + "&date=" + state.date;
    const data = await (await fetch(url)).json();
    box.textContent = "";
    if (!data.slots.length) {
      box.append(el("div", "note", "На эту дату свободного времени нет. Выберите другой день."));
      $("s4").classList.add("hidden");
      return;
    }
    data.slots.forEach(t => {
      const b = el("button", "chip", t);
      b.onclick = () => {
        mark(box, b);
        state.time = t;
        renderSummary();
        $("s4").classList.remove("hidden");
        updateButton();
        scrollTo("s4");
      };
      box.append(b);
    });
  } catch (e) {
    box.textContent = "";
    box.append(el("div", "note", "Ошибка загрузки. Попробуйте ещё раз."));
  }
}

function renderSummary() {
  const box = $("summary");
  box.textContent = "";
  box.append(
    el("div", "t", state.service.name),
    el("div", "s", state.master.name + " · " + state.dateLabel + ", " + state.time)
  );
  const p = el("div", "p");
  p.append(el("span", "", "К оплате в салоне"), el("span", "price", money(state.service.price)));
  box.append(p);
}

function validForm() {
  const phoneDigits = $("phone").value.replace(/\D/g, "");
  return state.service && state.master && state.date && state.time &&
    $("name").value.trim().length > 0 && phoneDigits.length >= 10 && phoneDigits.length <= 15;
}

function updateButton() {
  if (validForm()) {
    tg.MainButton.setText("Записаться · " + money(state.service.price));
    tg.MainButton.show();
  } else {
    tg.MainButton.hide();
  }
}

$("name").addEventListener("input", updateButton);
$("phone").addEventListener("input", updateButton);

tg.MainButton.onClick(() => {
  if (!validForm()) return;
  tg.sendData(JSON.stringify({
    service: state.service.id,
    master: state.master.id,
    date: state.date,
    time: state.time,
    name: $("name").value.trim(),
    phone: $("phone").value.trim()
  }));
});

init();
</script>
</body>
</html>
